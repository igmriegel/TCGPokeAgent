<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTCG Replay Visualizer</title>
</head>
<body>
  <h1>PTCG Replay Visualizer</h1>
  <p>Select a JSON replay generated by <code>scripts/run_replay.py</code>.</p>
  <input id="fileInput" type="file" accept="application/json,.json">
  <script>
    document.getElementById("fileInput").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (loadEvent) => {
        const replay = JSON.parse(loadEvent.target.result);
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "json";
        input.value = JSON.stringify(
          replay.steps ? replay.steps[0][0].visualize : replay
        );
        const form = document.createElement("form");
        form.method = "POST";
        form.action = "https://ptcgvis.heroz.jp/Visualizer/Replay/0";
        form.target = "_blank";
        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
