[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon_tcg_engine"
version = "0.1.0"
description = "Pokemon TCG AI Battle agent for Kaggle"
requires-python = ">=3.12"
dependencies = [
    "kaggle-environments==1.32.2",
    "kagglehub>=0.3",
    "PyYAML>=6.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=4.0",
]
notebooks = [
    "marimo>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["cg"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["cg", "cg.*"]
ignore_errors = true
